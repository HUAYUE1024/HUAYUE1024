name: profile assets
on:
  schedule: [{cron: "0 */6 * * *"}]
  workflow_dispatch:
  push: {branches: [main]}
permissions: {contents: write}
concurrency: {group: profile-assets, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: live stats + project cards
        run: python scripts/generate.py dist
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}

      - name: contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00F5D4&color_dots=#161b22,#003d35,#007a6a,#00b89f,#00F5D4

      - name: publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with: {target_branch: output, build_dir: dist, jekyll: false}
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}

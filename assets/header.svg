<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.dim{fill:#5c6773;font-size:15px}.k{fill:#00F5D4;font-size:14px;font-weight:700}.v{fill:#c9d1d9;font-size:14px}
.row{opacity:0;animation:in .45s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
.tag{opacity:0;animation:fade 1s ease-out 2.1s forwards}
@keyframes fade{to{opacity:1}}
.orb{animation:float 9s ease-in-out infinite alternate}
@keyframes float{from{transform:translate(0,0)}to{transform:translate(40px,18px)}}
</style>
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#00F5D4"/><stop offset=".6" stop-color="#00BBF9"/><stop offset="1" stop-color="#9B5DE5"/></linearGradient>
<radialGradient id="o1"><stop offset="0" stop-color="#00F5D4" stop-opacity=".18"/><stop offset="1" stop-color="#00F5D4" stop-opacity="0"/></radialGradient>
<radialGradient id="o2"><stop offset="0" stop-color="#9B5DE5" stop-opacity=".16"/><stop offset="1" stop-color="#9B5DE5" stop-opacity="0"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#00F5D4" stroke-opacity=".06"/></pattern>
<clipPath id="frame"><rect width="1000" height="300" rx="14"/></clipPath>
<clipPath id="type"><rect x="48" y="90" width="0" height="80"><animate attributeName="width" values="0;470" dur="1.8s" calcMode="spline" keySplines=".4 0 .2 1" fill="freeze"/></rect></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="1000" height="300" fill="#0a0e14"/>
<circle class="orb" cx="180" cy="230" r="220" fill="url(#o1)"/>
<circle class="orb" cx="860" cy="60" r="200" fill="url(#o2)" style="animation-duration:11s;animation-direction:alternate-reverse"/>
<rect width="1000" height="300" fill="url(#grid)"/>
<rect width="1000" height="42" fill="#0d131c"/>
<rect width="1000" height="2" fill="#00F5D4" opacity=".12"><animate attributeName="y" values="42;300" dur="3.5s" repeatCount="indefinite"/></rect>
</g>
<rect x=".5" y=".5" width="999" height="299" rx="14" fill="none" stroke="#00F5D4" stroke-opacity=".4"/>
<line x1="0" y1="42" x2="1000" y2="42" stroke="#1b2430"/>
<circle cx="26" cy="21" r="6" fill="#ff5f56"/><circle cx="46" cy="21" r="6" fill="#ffbd2e"/><circle cx="66" cy="21" r="6" fill="#27c93f"/>
<text x="500" y="26" class="dim" font-size="13" text-anchor="middle">huayue1024@localhost: ~ — zsh</text>

<!-- left: whoami -->
<text x="48" y="88" class="dim">$ whoami</text>
<g clip-path="url(#type)" filter="url(#glow)"><text x="48" y="152" fill="url(#g)" font-size="62" font-weight="800" letter-spacing="3">HUAYUE1024</text></g>
<rect x="48" y="104" width="26" height="54" fill="#00F5D4" opacity=".85"><animate attributeName="x" values="48;450" dur="1.8s" calcMode="spline" keySplines=".4 0 .2 1" fill="freeze"/><animate attributeName="opacity" values=".9;0;.9" dur="1s" begin="1.8s" repeatCount="indefinite"/></rect>
<g class="tag">
<text x="48" y="196" fill="#00F5D4" font-size="18">&gt; building local-first AI tools</text>
<text x="48" y="224" fill="#8b949e" font-size="14">在本地跑起来的 AI 工具 · MCP · RAG · Agents · Desktop UX</text>
<g transform="translate(48 250)">
<rect width="12" height="12" rx="2" fill="#ff5f56"/><rect x="18" width="12" height="12" rx="2" fill="#ffbd2e"/><rect x="36" width="12" height="12" rx="2" fill="#27c93f"/><rect x="54" width="12" height="12" rx="2" fill="#00BBF9"/><rect x="72" width="12" height="12" rx="2" fill="#9B5DE5"/><rect x="90" width="12" height="12" rx="2" fill="#00F5D4"/><rect x="108" width="12" height="12" rx="2" fill="#c9d1d9"/><rect x="126" width="12" height="12" rx="2" fill="#5c6773"/>
</g>
</g>

<!-- divider -->
<line x1="590" y1="72" x2="590" y2="268" stroke="#1b2430"/>

<!-- right: neofetch -->
<text x="620" y="88" class="dim">$ neofetch --short</text>
<g class="row" style="animation-delay:.5s"><text x="620" y="122" class="k">user</text><text x="710" y="122" class="v">huayue1024@github</text></g>
<g class="row" style="animation-delay:.7s"><text x="620" y="148" class="k">role</text><text x="710" y="148" class="v">student developer</text></g>
<g class="row" style="animation-delay:.9s"><text x="620" y="174" class="k">focus</text><text x="710" y="174" class="v">MCP · RAG · Agents</text></g>
<g class="row" style="animation-delay:1.1s"><text x="620" y="200" class="k">craft</text><text x="710" y="200" class="v">desktop UX · liquid glass</text></g>
<g class="row" style="animation-delay:1.3s"><text x="620" y="226" class="k">stack</text><text x="710" y="226" class="v">Python · JS · C# · Electron</text></g>
<g class="row" style="animation-delay:1.5s"><text x="620" y="252" class="k">motto</text><text x="710" y="252" class="v">local-first, always.</text></g>
</svg>
